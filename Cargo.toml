[package]
name = "pam-okh"
version = "0.1.0"
edition = "2024"
description = "PAM - Okamžikové heslo"
license = "MIT"
repository = "https://github.com/lastaapps/pam-okh"
keywords = ["pam", "authentication", "otp"]
categories = ["authentication"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pam-bindings = "0.1.1"
rand = "0.9.0-alpha.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }


